[package]
name = "converters-v2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
clap = { version = "4.5.53", features = ["derive"] }
console = "0.16.1"
flate2 = "1.1.5"
futures = "0.3.31"
indicatif = "0.18.3"
isolang = "2.4.0"
map-macro = "0.3.0" 
odict = "3.2.2"
quick-xml = { version = "0.38.4", features = ["overlapped-lists", "serialize"] }
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["stream"] }
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.43"
tempdir = "0.3.7"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros"] }
liblzma = "0.4.1"