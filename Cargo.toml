[package]
name = "converters-v2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
flate2 = "1.1.9"
futures = "0.3.32"
indicatif = "0.18.4"
isolang = "2.4.0"
map-macro = "0.3.0"
odict = "3.2.2"
quick-xml = { version = "0.40.1", features = ["overlapped-lists", "serialize"] }
regex = "1.12.4"
reqwest = { version = "0.13.4", features = ["stream"] }
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.46"
tempdir = "0.3.7"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
liblzma = "0.4.6"
