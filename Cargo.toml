[package]
name = "converters-v2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
clap = { version = "4.5.47", features = ["derive"] }
console = "0.16.1"
flate2 = "1.1.2"
indicatif = "0.18.0"
isolang = "2.4.0"
map-macro = "0.3.0"
odict = "3.1.0"
